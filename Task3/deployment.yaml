apiVersion: apps/v1
kind: Deployment
metadata:
  name: novamarket-service
  labels:
    app: novamarket
spec:
  selector:
    matchLabels:
      app: novamarket
  template:
    metadata:
      labels:
        app: novamarket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: novamarket
        image: ghcr.io/yandex-practicum/scaletestapp:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 20Mi
          limits:
            memory: 30Mi