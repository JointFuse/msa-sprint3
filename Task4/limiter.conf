http {
    limit_req_zone $binary_remote_addr zone=one:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=web_zone:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile_zone:10m rate=30r/s;

    upstream backend {
        server localhost:8081;
    }
    
    server {
        listen 80;

        location /api/ {
            set $limit_zone_name one;

            if ($http_x_client_type = "mobile") {
                set $limit_zone_name mobile_zone
            }
            if ($http_x_client_type = "web") {
                set $limit_zone_name web_zone
            }
            
            limit_req zone=$limit_zone_name burst=200;
            proxy_pass http://backend;
        }
    }
}